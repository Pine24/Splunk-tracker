name: Refresh data
on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Update versions.json
        id: versions
        continue-on-error: true
        run: python scripts/update_versions.py
      - name: Update splunkbase.json
        id: splunkbase
        continue-on-error: true
        run: python scripts/update_splunkbase.py
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain public/data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "chore: refresh data"
            git push
          else
            echo "No data changes"
          fi
      - name: Fail the run if any refresh step failed
        if: steps.versions.outcome == 'failure' || steps.splunkbase.outcome == 'failure'
        run: |
          echo "versions: ${{ steps.versions.outcome }}, splunkbase: ${{ steps.splunkbase.outcome }}"
          exit 1
